<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom — {% block title %}Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .page-sub { color: var(--ink-soft, #7a7a8c); font-size: 14px; text-decoration: none; }
    .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--mint-pale, #e6f7f0); color: var(--purple-dark, #4a3b7c); }
    .panel { background: #fff; border: 1px solid var(--line, #ece9f3); border-radius: 20px; padding: 26px; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label, .filters label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft, #7a7a8c); margin-bottom: 6px; }
    .field input, .field select, .filters select { width: 100%; border: 1px solid var(--line, #ece9f3); border-radius: 12px; padding: 11px 14px; font-family: inherit; font-size: 13.5px; background: #fff; }
    .btn-wide { width: 100%; justify-content: center; text-align: center; text-decoration: none; }

    /* explore */
    .explore-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .school-card { background: #fff; border: 1px solid var(--line, #ece9f3); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; transition: transform .15s, box-shadow .15s; }
    .school-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(60, 40, 100, .08); }
    .school-name { font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0; }
    .school-loc { color: var(--ink-soft, #7a7a8c); font-size: 13px; margin-top: 4px; }
    .school-price { font-size: 13px; color: var(--ink-soft, #7a7a8c); }
    .school-price b { display: block; font-size: 24px; font-weight: 700; color: var(--ink, #2b2b3a); }
    .soon-msg { display: none; font-size: 12.5px; color: var(--ink-soft, #7a7a8c); text-align: center; margin-top: -10px; }

    /* detail */
    .d-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .d-title { font-weight: 700; font-size: 30px; margin: 0; }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .sum-box { background: #fff; border: 1px solid var(--line, #ece9f3); border-radius: 20px; padding: 22px 24px; }
    .sum-box small { display: block; color: var(--ink-soft, #7a7a8c); font-size: 12.5px; margin-bottom: 8px; }
    .sum-box b { font-size: 28px; font-weight: 700; }
    .sum-box.hl { background: var(--mint-pale, #e6f7f0); border-color: transparent; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { border: 0; background: transparent; padding: 10px 20px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft, #7a7a8c); cursor: pointer; }
    .tab-btn.on { background: var(--mint-pale, #e6f7f0); color: var(--purple-dark, #4a3b7c); }
    .tab-pane { display: none; }
    .tab-pane.on { display: block; }
    .line-row { display: flex; justify-content: space-between; gap: 16px; padding: 15px 0; border-top: 1px solid var(--line, #ece9f3); font-size: 14px; }
    .line-row:first-child { border-top: 0; }
    .line-row.total { font-weight: 700; font-size: 15px; }
    details.more { margin-top: 20px; font-size: 13px; color: var(--ink-soft, #7a7a8c); }
    details.more summary { cursor: pointer; font-weight: 600; }
    details.more p { margin: 10px 0 0; line-height: 1.6; }
    .aid-item { border-top: 1px solid var(--line, #ece9f3); }
    .aid-item:first-child { border-top: 0; }
    .aid-item summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; font-weight: 700; font-size: 14.5px; }
    .aid-item summary::-webkit-details-marker { display: none; }
    .aid-item summary::after { content: "+"; color: var(--ink-soft, #7a7a8c); font-weight: 400; font-size: 20px; }
    .aid-item[open] summary::after { content: "−"; }
    .aid-item p { margin: 0 0 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft, #7a7a8c); }
    .src-links { font-size: 12.5px; color: var(--ink-soft, #7a7a8c); margin-top: 8px; }
    .src-links a { margin-right: 14px; }

    /* scholarships */
    .aid-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 26px; margin-bottom: 16px; }
    .aid-info.off { opacity: .45; }
    .aid-actions { display: flex; align-items: center; gap: 16px; }
    .icon-btn { border: 0; background: none; color: var(--ink-soft, #7a7a8c); cursor: pointer; font-size: 16px; padding: 4px 8px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cfd8dc; border-radius: 24px; cursor: pointer; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--mint, #7ed6b2); }
    .switch input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">🌱</div>
        Bloom
      </div>
            <nav class="nav">
        <a class="nav-item {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
          <span class="icon">🏠</span> Dashboard
        </a>
        <a class="nav-item {% if active == 'transactions' %}active{% endif %}" href="{{ url_for('transactions') }}">
          <span class="icon">🧾</span> Transactions
        </a>
        <a class="nav-item {% if active == 'goals' %}active{% endif %}" href="{{ url_for('goals') }}">
          <span class="icon">🎯</span> Goals
        </a>
        <a class="nav-item {% if active == 'college' %}active{% endif %}" href="{{ url_for('college') }}">
          <span class="icon">🎓</span> College Costs
        </a>
        <a class="nav-item {% if active == 'explore' %}active{% endif %}" href="{{ url_for('explore') }}">
          <span class="icon">🔎</span> Explore Colleges
        </a>
        <a class="nav-item {% if active == 'scholarships' %}active{% endif %}" href="{{ url_for('scholarships') }}">
          <span class="icon">🏅</span> Scholarships
        </a>
        <a class="nav-item {% if active == 'chat' %}active{% endif %}" href="{{ url_for('chat') }}">
          <span class="icon">💬</span> Ask Bloom AI
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="streak">🔥 Saving streak</div>
        <div class="streak-value">12 days</div>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <a href="{{ url_for('chat') }}" class="ai-fab" title="Ask Bloom AI">💬</a>
</body>
</html>
